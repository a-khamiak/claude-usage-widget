name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint, unit tests, debug build
        run: ./gradlew --no-daemon --console=plain lint testDebugUnitTest assembleDebug
      - name: Show failing tests and lint errors
        if: failure()
        run: |
          find app/build/test-results -name '*.xml' -exec grep -l '<failure' {} + 2>/dev/null \
            | xargs -r grep -h -A5 '<failure' | head -80 || true
          find app/build/reports -name 'lint-results*.txt' -exec tail -60 {} + 2>/dev/null || true
